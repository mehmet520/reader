<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--muted:#6b6b6b;--line:#e2ded6;--card:#fff;--acc:#2f6fdb}
@media (prefers-color-scheme:dark){:root{--bg:#1d1d1f;--fg:#eee;--muted:#a0a0a0;--line:#3a3a3c;--card:#2a2a2c;--acc:#7aa7ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px}
h1{font-size:1.4em;margin:0 0 4px}
.muted{color:var(--muted);font-size:.9em}
label.open{display:inline-block;margin:18px 0;padding:10px 18px;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
label.open input{display:none}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:12px;margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:10px}
li a{flex:1;color:var(--fg);text-decoration:none;font-weight:600;overflow-wrap:anywhere}
li a span{display:block;font-weight:400}
li button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:6px 10px;font:inherit;font-size:.85em;cursor:pointer}
#msg{min-height:1.5em;color:#c0392b}
</style>
</head>
<body>
<main>
<h1>Reader</h1>
<p class="muted">Opens reading files (HTML) made by the html-okuma-dosyasi tool. Files stay on this device; nothing is uploaded.</p>
<label class="open">＋ Open file<input id="pick" type="file" accept=".html,.htm,text/html" multiple></label>
<div id="msg" role="status"></div>
<ul id="list"></ul>
<p class="muted" id="empty" hidden>No files yet. Download a reading file, then open it here. It is kept here for next time, with your read marks and flags.</p>
</main>
<script src="app.js"></script>
</body>
</html>
